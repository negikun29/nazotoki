<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rotor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card hero">
      <p class="eyebrow">謎解き判定ページ</p>
    </section>

    <section class="card" id="smallStage">
	  <h2>小なぞの答えを入力</h2>
	  <p class="note">小なぞの答えを確認できます。</p>

	  <div class="answer-box">
	    <input id="miniAnswer" type="text" placeholder="小なぞの答え" />
	    <button onclick="checkMiniAnswer()">判定</button>
	  </div>

	  <p id="miniResult" class="result"></p>
	</section>

    <section class="card" id="stage1">
      <h2>最後のなぞを確認して答えを入力</h2>
      <figure class="image-box">
        <img src="images/last.png" alt="最後のなぞ" onerror="this.closest('figure').classList.add('image-missing')" />
      </figure>
      <div class="answer-box">
        <input id="answer1" type="text" placeholder="答えを入力" />
        <button onclick="checkAnswer()">判定</button>
      </div>
      <div id="result1" class="result"></div>
      <details class="hint">
        <summary>ヒント</summary>
        <details class="hint">
        	<summary>ヒント:①</summary>
        	<p>なぞの枠の色がつながるように、順番にならべて今までの答えをかきだしてみよう</p>
      	</details>
        <details class="hint">
        	<summary>ヒント:②</summary>
        	<p>「ありくつみきみつ？」の順番になるはずだ。続いて並べた時の色がどのようなグラデーションになっているかを考えよう。</p>
      	</details>
        <details class="hint">
        	<summary>ヒント:③</summary>
        	<p>グラデーションは赤・橙・緑・青・紫・青・緑・橙・赤となっている。</p>
      	</details>
        <details class="hint">
        	<summary>答え</summary>
        	<p>答え全部で回文になっている。グラデーションが途中で反転しているのは回文を示唆しているため。回文にするために「ありくつみきみつ？」に入るものは「くりあ」</p>
      	</details>
      </details>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
